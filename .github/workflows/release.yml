name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: make setup
      - run: bun run scripts/check-release.ts "$GITHUB_REF_NAME"
      - run: make check
      # With a trusted publisher configured on npmjs.com, OIDC is used and NPM_TOKEN may be absent.
      # A prerelease (v1.2.0-rc.1) goes to the "next" dist-tag so it never becomes "latest".
      - run: npm publish --provenance --access public $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --tag next || true)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
        env:
          GH_TOKEN: ${{ github.token }}
